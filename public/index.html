<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>台股快速看板</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>台股快速看板</h1>
    <div class="update-info">
      <span id="update-time">尚未更新</span>
      <button id="refresh-btn" title="立即更新">重新整理</button>
    </div>
  </header>

  <section id="market-index" class="market-index"></section>

  <form id="add-form" class="add-form">
    <input id="code-input" type="text" inputmode="numeric" placeholder="輸入股票代碼，例如 2330" maxlength="6" />
    <button type="submit">新增</button>
  </form>

  <p id="error-msg" class="error-msg" hidden></p>

  <main id="stock-list" class="stock-list"></main>

  <p id="empty-msg" class="empty-msg" hidden>目前沒有追蹤任何股票，請在上方輸入股票代碼新增。</p>

  <footer class="footnote">
    資料來源：證交所盤中即時揭示（延遲約 5 分鐘），僅供參考，非投資建議。
  </footer>

  <script src="app.js"></script>
</body>
</html>
